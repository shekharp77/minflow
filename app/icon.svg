<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="minflow">
  <!--
    The mark is the first letter of the name drawn the way the library draws
    icons: two geometric arches on a stroke, round caps and joins, matching the
    lucide construction the whole system uses. Weight is 2.5 rather than the
    interface 1.75 because a favicon is read at 16px, where a hairline
    disappears. Colours are literal here on purpose: a favicon renders outside
    the document, so it cannot reach a CSS custom property.
  -->
  <rect width="32" height="32" rx="7" fill="#0f1011"/>
  <path d="M8 21v-6a4 4 0 0 1 8 0v6m0-6a4 4 0 0 1 8 0v6"
        fill="none" stroke="#ffffff" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
